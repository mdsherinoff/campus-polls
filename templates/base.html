<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8A1538">
  <title>{% block title %}Campus Polls{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%238A1538'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=7">
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <a class="skip" href="#main">Skip to main content</a>
  {% set path = request.path %}
  <header class="topbar">
    <div class="wrap {% block headwrap %}{% endblock %} topbar-inner">
      <a class="brand" href="/">Campus Polls</a>
      <nav class="topnav" aria-label="Main">
        <a href="/" {% if path == '/' %}aria-current="page"{% endif %}>Vote</a>
        <a href="/board" {% if path == '/board' %}aria-current="page"{% endif %}><span class="long">Bulletin board</span><span class="short">Board</span></a>
        <a href="/verify" {% if path == '/verify' %}aria-current="page"{% endif %}><span class="long">Check my vote</span><span class="short">Check vote</span></a>
        <a href="/learn" {% if path == '/learn' %}aria-current="page"{% endif %}>How it works</a>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap {% block mainclass %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <div class="wrap {% block footwrap %}{% endblock %}">Campus Polls &middot; CMPS 380 &middot; Group G03</div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
